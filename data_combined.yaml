# 누적 학습셋 (기본 통합 구성).
#
# 경로는 --data-root (기본: ./data_exist) 기준 **상대경로**.
#   train_vincode.py 가 실행 시 절대경로를 채운 해석본을 .cache/ 에 만들어 넘긴다.
#   (ultralytics 는 path: 가 상대면 자기 settings 의 datasets_dir 기준으로 풀기 때문에
#    여기에 상대경로를 그대로 두면 저장소 위치에 따라 깨진다.)
#
# 버전 버킷:
#   v1_roboflow  : 초기 공개/컬러 데이터 (도메인 다름)
#   v2_visolabel : 현장 촬영 + VisoLabel 검수 데이터 (배포 도메인)
#
# 설계 의도:
#   - train    : v1 전부(train/valid/test) + 현장 train  — 데이터가 적어 v1 split 을 모두 학습에 투입
#   - val/test : 현장 데이터만  → best.pt 를 '실제 배포 환경' 기준으로 선택 (미탐 최소화)
train:
  - train/images/v1_roboflow
  - valid/images/v1_roboflow
  - test/images/v1_roboflow
  - train/images/v2_visolabel
val:
  - valid/images/v2_visolabel
test:
  - test/images/v2_visolabel

nc: 1
names: ['Barcode Sticker']
